<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel Storefront // Customer Checkout</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 2.5rem;
            border-radius: 16px;
            border: 1px solid #334155;
            width: 360px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        h2 { margin-top: 0; color: #818cf8; font-size: 1.5rem; }
        p { color: #94a3b8; font-size: 0.875rem; margin-bottom: 1.5rem; }
        .field { margin-bottom: 1.25rem; text-align: left; }
        label { display: block; font-size: 0.75rem; text-transform: uppercase; color: #94a3b8; font-weight: 600; margin-bottom: 0.5rem; }
        input {
            width: 100%;
            padding: 0.75rem;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
            font-size: 0.95rem;
        }
        input:focus { outline: 2px solid #6366f1; border-color: transparent; }
        .error { color: #fca5a5; font-size: 0.8rem; line-height: 1.4; min-height: 1.2rem; margin: 0.5rem 0 0.75rem; text-align: left; }
        button {
            background: #6366f1;
            color: white;
            border: none;
            padding: 0.875rem;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            margin-top: 0.5rem;
            transition: background 0.2s;
        }
        button:hover { background: #4f46e5; }
    </style>
</head>
<body>

<div class="card">
    <h2>🛍️ Sentinel Store</h2>
    <p>Simulate Customer & Attack Scenarios</p>

    <div id="user-badge" style="display:none; font-size:0.8rem; background:rgba(99,102,241,0.15); border:1px solid rgba(99,102,241,0.4); border-radius:8px; padding:0.5rem 0.75rem; margin-bottom:1.25rem; color:#c7d2fe; text-align:left;">
        Linked Account: <strong id="user-badge-email" style="color:#fff;"></strong>
    </div>
    
    <div class="field">
        <label>Customer / Attacker Email</label>
        <input type="email" id="email" value="attacker@example.com">
    </div>

    <div class="field">
        <label>Phone Number</label>
        <input type="tel" id="phone" value="9876543210">
    </div>

    <div class="field">
        <label>Amount (INR ₹)</label>
        <input type="number" id="amount" value="10000" min="1" max="500000" step="0.01">
        <div class="error" id="amount-error" role="alert"></div>
    </div>

    <button id="rzp-button">Trigger Payment</button>
</div>

<script>
function getActiveSession() {
    try {
        const urlParams = new URLSearchParams(window.location.search);
        const qUserId = urlParams.get('userId');
        const qUserEmail = urlParams.get('userEmail');
        if (qUserId || qUserEmail) {
            return {
                userId: qUserId ? Number(qUserId) : null,
                email: qUserEmail || null
            };
        }
        const token = localStorage.getItem('sentinel_auth_token');
        if (token) {
            const payload = JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
            return {
                userId: payload.userId || null,
                email: payload.sub || null
            };
        }
    } catch (e) {
        console.warn('Session parse error:', e);
    }
    return null;
}

const activeSession = getActiveSession();
if (activeSession && (activeSession.email || activeSession.userId)) {
    const badge = document.getElementById('user-badge');
    const badgeEmail = document.getElementById('user-badge-email');
    if (badge && badgeEmail) {
        badge.style.display = 'block';
        badgeEmail.textContent = activeSession.email || ('User #' + activeSession.userId);
    }
}

document.getElementById('rzp-button').onclick = function(e){
    e.preventDefault();

    var email = document.getElementById('email').value;
    var phone = document.getElementById('phone').value;
    var amountInput = document.getElementById('amount');
    var amountError = document.getElementById('amount-error');
    var amountInRupees = Number(amountInput.value);
    amountError.textContent = '';

    if (!Number.isFinite(amountInRupees) || amountInRupees <= 0) {
        amountError.textContent = 'Enter an amount greater than zero.';
        amountInput.focus();
        return;
    }
    if (amountInRupees > 500000) {
        amountError.textContent = 'Maximum transaction amount is Rs 5,00,000.';
        amountInput.focus();
        return;
    }

    var amountInPaise = Math.round(amountInRupees * 100);

    var options = {
        "key": "rzp_test_TmdOfT5eSaplLI",
        "amount": amountInPaise,
        "currency": "INR",
        "name": "Sentinel Store",
        "description": "Customer Checkout",
        "prefill": {
            "email": email,
            "contact": phone
        },
        "theme": { "color": "#6366f1" },
        "handler": async function (response){
            // Switch UI to Processing State
            document.querySelector('.card').innerHTML = `<h2>⚙️ Processing Order...</h2><p>Please do not close this window.</p>`;
            
            // Push to Backend
            await syncWithBackend("payment.captured", response.razorpay_payment_id, amountInPaise, email, "captured", null, phone);
            
            // Render Final Receipt UI
            document.querySelector('.card').innerHTML = `
                <h2>✅ Payment Successful!</h2>
                <p>Your order has been placed successfully.</p>
                <p style="color: #6366f1; font-family: monospace; font-size: 0.85rem;">Receipt ID: ${response.razorpay_payment_id}</p>
                <button onclick="location.reload()">Place Another Order</button>
            `;
        }
    };

    var rzp1 = new Razorpay(options);

    rzp1.on('payment.failed', async function (response){
        var failId = (response.error && response.error.metadata && response.error.metadata.payment_id) 
            ? response.error.metadata.payment_id 
            : ("pay_fail_" + Date.now());

        document.querySelector('.card').innerHTML = `<h2>🚨 Payment Failed</h2><p>Processing error.</p>`;
        await syncWithBackend("payment.failed", failId, amountInPaise, email, "failed", response.error && response.error.description, phone);
        
        document.querySelector('.card').innerHTML += `<button onclick="location.reload()">Try Again</button>`;
    });

    rzp1.open();
};

async function syncWithBackend(eventType, paymentId, amount, email, status, errorReason = null, phone) {
    var session = getActiveSession();
    var payload = {
        event: eventType,
        payload: {
            payment: {
                entity: {
                    id: paymentId,
                    amount: amount,
                    status: status,
                    method: "card",
                    email: email,
                    contact: phone,
                    user_agent: navigator.userAgent,
                    error_reason: errorReason,
                    card_network: status === "failed" ? "Unknown" : "Visa",
                    card_type: status === "failed" ? "prepaid" : "credit",
                    issuer_bank: "HDFC",
                    international: false,
                    user_id: session ? session.userId : null,
                    user_email: session ? session.email : null,
                    notes: {
                        userId: session ? session.userId : null,
                        user_id: session ? session.userId : null,
                        userEmail: session ? session.email : null,
                        user_email: session ? session.email : null
                    }
                }
            }
        }
    };

    var backendBase = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
        ? 'http://localhost:8080'
        : 'https://sentinel-riskops.onrender.com';

    try {
        const response = await fetch(backendBase + '/api/webhooks/razorpay', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        
        if (!response.ok) {
            console.error("Backend returned an error:", response.status);
        }
    } catch (err) {
        console.error("Failed to connect to backend:", err);
    }
}
</script>

</body>
</html>
