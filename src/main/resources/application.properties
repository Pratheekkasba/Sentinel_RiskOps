spring.datasource.url=jdbc:mysql://localhost:3306/sentinel_riskops?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=sreematha@123

# Auto-creates/updates tables based on your Java entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── JWT Authentication ─────────────────────────────────────────────────────────
# IMPORTANT: Change this secret to a strong random 256-bit (32+ char) key in production
jwt.secret=SentinelSecretKey2024_ChangeInProduction_MustBe32CharsMin!!
jwt.expiration-ms=86400000

# ── Webhook HMAC verification ─────────────────────────────────────────────────
sentinel.webhook.signature.enabled=false
sentinel.webhook.secret=change-me

# ── Model evaluation ──────────────────────────────────────────────────────────
# Estimated INR cost of incorrectly flagging one legitimate payment.
sentinel.evaluation.false-positive-cost=2500