spring.datasource.url=jdbc:mysql://localhost:3306/sentinel_riskops?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=sreematha@123

# Auto-creates/updates tables based on your Java entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Enable these safeguards before deploying outside the local demo.
sentinel.auth.enabled=false
sentinel.auth.admin-token=change-me
sentinel.webhook.signature.enabled=false
sentinel.webhook.secret=change-me

# Estimated INR cost of incorrectly flagging one legitimate payment.
sentinel.evaluation.false-positive-cost=2500