spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sentinel_riskops?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sreematha@123}

# Auto-creates/updates tables based on your Java entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
server.port=${PORT:8080}

# ── JWT Authentication ─────────────────────────────────────────────────────────
# IMPORTANT: In production, supply a strong 256-bit secret via JWT_SECRET env var
jwt.secret=${JWT_SECRET:SentinelSecretKey2024_ChangeInProduction_MustBe32CharsMin!!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── Webhook HMAC verification ─────────────────────────────────────────────────
sentinel.webhook.signature.enabled=false
sentinel.webhook.secret=${WEBHOOK_SECRET:change-me}

# ── Model evaluation ──────────────────────────────────────────────────────────
# Estimated INR cost of incorrectly flagging one legitimate payment.
sentinel.evaluation.false-positive-cost=2500